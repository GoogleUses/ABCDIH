


<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap');
        
        html,
        body {
            background-image: url("https://cdn.jsdelivr.net/gh/kelsimsk/zarara@main/Build/Build.png");
            background-position: center;
            background-repeat: no-repeat;
            background-size: cover;
            width: 100%;
            height: 100%;
            overflow: visible;
            padding: 0;
            margin: 0;
            background-color: black;
            font-family: 'Poppins', sans-serif;
        }

        div#gameContainer {
            background: transparent !important;
            position: absolute;
            top: 0px !important;
            width: 100% !important;
            height: 100% !important;
            left: 0px !important;
        }

        div#gameContainer canvas {
            position: absolute;
            width: 100% !important;
            height: 100% !important;
        }

        div#gameContainer canvas[data-pixel-art="true"] {
            position: absolute;
            image-rendering: optimizeSpeed;
            image-rendering: -webkit-crisp-edges;
            image-rendering: -moz-crisp-edges;
            image-rendering: -o-crisp-edges;
            image-rendering: crisp-edges;
            image-rendering: -webkit-optimize-contrast;
            image-rendering: optimize-contrast;
            image-rendering: pixelated;
            -ms-interpolation-mode: nearest-neighbor;
        }

        .loadingOut {
            width: 350px;
            position: fixed;
            left: 50%;
            top: calc(50%);
            transform: translate(-50%);
            border-radius: 25px;
            height: 8px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            overflow: hidden;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            transition: opacity 0.5s ease-out;
        }

        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, #00f5ff, #ff00ff, #00f5ff);
            background-size: 200% 100%;
            animation: gradientShift 2s ease-in-out infinite;
            border-radius: 25px;
            transition: width 0.5s ease-out;
            position: relative;
            width: 0%;
        }

        .progress-bar::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
            animation: shimmer 1.5s ease-in-out infinite;
            border-radius: 25px;
        }

        @keyframes gradientShift {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }

        @keyframes shimmer {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }

        @keyframes pulse {
            0%, 100% { transform: translate(-50%, -50%) scale(1); }
            50% { transform: translate(-50%, -50%) scale(1.05); }
        }

        .centered {
            position: fixed;
            top: calc(50% - 120px);
            left: 50%;
            transform: translate(-50%, -50%);
            width: 750px;
            text-align: center;
            animation: pulse 3s ease-in-out infinite;
            filter: drop-shadow(0 0 20px rgba(255, 255, 255, 0.3));
            transition: opacity 0.5s ease-out;
        }

        #orientation-warning {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: linear-gradient(135deg, rgba(255, 0, 100, 0.9), rgba(255, 100, 0, 0.9));
            color: white;
            padding: 40px 50px;
            border-radius: 20px;
            text-align: center;
            z-index: 1000;
            backdrop-filter: blur(20px);
            border: 2px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
            font-weight: 600;
            font-size: 18px;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.3);
            animation: orientationPulse 2s ease-in-out infinite;
            max-width: 90vw;
            max-height: 90vh;
            min-width: 300px;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 20px;
        }

        #orientation-warning.show {
            display: flex;
        }

        @keyframes orientationPulse {
            0%, 100% { transform: translate(-50%, -50%) scale(1); }
            50% { transform: translate(-50%, -50%) scale(1.02); }
        }

        @keyframes rotateImage {
            0%, 100% { transform: rotate(0deg); }
            25% { transform: rotate(-5deg); }
            75% { transform: rotate(5deg); }
        }

        #orientation-image {
            width: 80px;
            height: 80px;
            display: block;
            filter: brightness(1.2) drop-shadow(0 0 15px rgba(255, 255, 255, 0.6));
            animation: rotateImage 3s ease-in-out infinite;
            flex-shrink: 0;
        }

        .orientation-text {
            font-size: 16px;
            line-height: 1.5;
            margin: 0;
            flex-shrink: 0;
        }

        @media (max-width: 480px) {
            #orientation-warning {
                padding: 30px 25px;
                font-size: 16px;
                min-width: 280px;
                gap: 15px;
            }
            #orientation-image { width: 60px; height: 60px; }
            .orientation-text { font-size: 14px; }
        }

        @media (max-height: 500px) {
            #orientation-warning { padding: 20px 30px; gap: 10px; }
            #orientation-image { width: 50px; height: 50px; }
            .orientation-text { font-size: 14px; }
        }
    </style>
</head>

        </div>
