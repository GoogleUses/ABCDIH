<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<style>
        @import url('https://fonts.googleapis.com/css2?family=Ubuntu:wght@700;900&display=swap');
        
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: #111; font-family: 'Ubuntu', 'Segoe UI', sans-serif; user-select: none; -webkit-user-select: none; -moz-user-select: none; -ms-user-select: none; }
        canvas { display: block; }
        
        #custom-cursor { position: fixed; top: 0; left: 0; width: 24px; height: 24px; pointer-events: none; z-index: 999999; transform: translate(-50%, -50%); display: none; }
        #custom-cursor::before, #custom-cursor::after { content: ''; position: absolute; background: rgba(255,255,255,0.8); }
        #custom-cursor::before { top: 11px; left: 0; width: 24px; height: 2px; }
        #custom-cursor::after { top: 0; left: 11px; width: 2px; height: 24px; }

        #ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; display: none; }
        .ui-box { position: absolute; background: rgba(0, 0, 0, 0.6); color: #fff; padding: 12px; border-radius: 8px; pointer-events: auto; }
        
        #player-info { bottom: 20px; left: 50%; transform: translateX(-50%); text-align: center; width: 400px; pointer-events: none;}
        #xp-bar-bg { width: 100%; height: 22px; background: #333; border-radius: 11px; overflow: hidden; margin-top: 10px; border: 3px solid #000; position: relative; box-shadow: 0 0 10px rgba(0,0,0,0.5);}
        #xp-bar-fill { height: 100%; width: 0%; background: #ffe02f; transition: width 0.2s; }
        #xp-text { position: absolute; width: 100%; top: 0; left: 0; text-align: center; font-size: 14px; font-weight: 900; text-shadow: 1px 1px 0 #000, -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000; line-height: 22px; color: #fff;}
        
        #leaderboard { top: 20px; right: 20px; width: 200px; text-align: left; border: 2px solid #555;}
        #leaderboard h3 { margin: 0 0 10px 0; font-size: 16px; text-align: center; color: #fff; text-shadow: 1px 1px 0 #000;}
        .lb-entry { font-size: 14px; margin-bottom: 6px; color: #ccc; display: flex; justify-content: space-between; font-weight: bold; text-shadow: 1px 1px 0 #000;}
        
        #exit-btn { position: absolute; top: 20px; right: 260px; pointer-events: auto; }
        
        #minimap { bottom: 20px; right: 20px; width: 150px; height: 150px; background: rgba(255,255,255,0.05); border: 3px solid #555; border-radius: 8px; box-shadow: 0 0 15px rgba(0,0,0,0.5);}
        #miniCanvas { width: 100%; height: 100%; display: block; border-radius: 5px; }
        
        /* Адаптация под маленькие экраны */
        @media (max-width: 850px) {
            #player-info { width: 40vw; min-width: 250px; }
            #minimap { width: 120px; height: 120px; }
        }
        @media (max-width: 600px) {
            #player-info { width: calc(100% - 130px); left: 10px; transform: none; bottom: 10px; }
            #minimap { width: 100px; height: 100px; right: 10px; bottom: 10px; }
            #level-text { font-size: 18px !important; }
            #exit-btn { right: 10px; top: 10px; padding: 5px 15px; font-size: 12px; }
            #leaderboard { top: 50px; right: 10px; width: 150px; }
        }
        
        #upgrade-menu { position: absolute; top: 20px; left: 20px; display: none; grid-template-columns: repeat(2, 1fr); gap: 10px; pointer-events: auto; }
        .upgrade-card { background: rgba(30, 30, 30, 0.9); border: 3px solid #00b2e1; border-radius: 10px; width: 110px; display: flex; flex-direction: column; align-items: center; padding: 10px; cursor: pointer; transition: transform 0.15s, background 0.15s, box-shadow 0.15s; box-shadow: 0 6px 12px rgba(0,0,0,0.5); }
        .upgrade-card:hover, .upgrade-card.sim-hover { transform: scale(1.08) translateY(-5px); background: rgba(50, 50, 50, 1) !important; box-shadow: 0 10px 20px rgba(0,178,225,0.4) !important; }
        .upgrade-card canvas { width: 90px; height: 90px; margin-bottom: 5px; }
        .upgrade-card .label { color: white; font-size: 14px; font-weight: bold; text-align: center; text-shadow: 1px 1px 0 #000; }
        
        .overlay-screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: radial-gradient(circle at center, rgba(30,30,30,0.8) 0%, rgba(0,0,0,0.95) 100%); display: flex; flex-direction: column; justify-content: center; align-items: center; pointer-events: auto; z-index: 100; cursor: default; }
        .menu-container { background: #222; padding: 40px; border-radius: 15px; text-align: center; border: 4px solid #444; box-shadow: 0 15px 50px rgba(0,0,0,0.9), inset 0 0 50px rgba(0,0,0,0.5); width: 420px; max-width: 90vw; }
        .game-title { font-size: 65px; font-weight: 900; color: #fff; -webkit-text-stroke: 3px #000; text-shadow: 4px 4px 0px #000, 0 0 30px rgba(0, 178, 225, 0.6); margin-bottom: 30px; letter-spacing: 2px;}
        
        input[type="text"] { padding: 15px; font-size: 22px; width: 100%; box-sizing: border-box; border-radius: 8px; border: 3px solid #555; background: #111; color: #fff; outline: none; text-align: center; font-family: 'Ubuntu', sans-serif; font-weight: bold; margin-bottom: 25px; transition: border-color 0.2s; user-select: auto; -webkit-user-select: auto; }
        input[type="text"]:focus { border-color: #00b2e1; }
        
        .mode-selector { display: flex; justify-content: space-between; gap: 10px; margin-bottom: 30px; }
        .mode-btn { background: #333; color: #aaa; border: 3px solid #111; padding: 12px 0; flex: 1; cursor: pointer; border-radius: 8px; font-weight: bold; font-size: 15px; transition: all 0.2s; text-shadow: 1px 1px 0 #000; box-shadow: inset 0 -3px 0 rgba(0,0,0,0.4);}
        .mode-btn:hover, .mode-btn.sim-hover { background: #444; color: #fff; transform: translateY(-2px);}
        .mode-btn.active { background: linear-gradient(to bottom, #00b2e1, #008eb4); color: #fff; border-color: #000; transform: scale(1.05); box-shadow: 0 5px 15px rgba(0, 178, 225, 0.5), inset 0 2px 2px rgba(255,255,255,0.3); z-index: 2;}
        .mode-btn[data-mode="teams"].active { background: linear-gradient(to bottom, #f14e54, #cc3e43); box-shadow: 0 5px 15px rgba(241, 78, 84, 0.5), inset 0 2px 2px rgba(255,255,255,0.3); }
        .mode-btn[data-mode="maze"].active { background: linear-gradient(to bottom, #00e16e, #00ba5a); box-shadow: 0 5px 15px rgba(0, 225, 110, 0.5), inset 0 2px 2px rgba(255,255,255,0.3); }

        .btn-3d { width: 100%; padding: 18px; font-size: 24px; cursor: pointer; color: white; border: 3px solid #000; border-radius: 8px; font-weight: 900; transition: transform 0.1s, box-shadow 0.1s, filter 0.2s; margin-bottom: 15px; text-shadow: 2px 2px 0px #000; font-family: 'Ubuntu', sans-serif; text-transform: uppercase; }
        .btn-primary { background: linear-gradient(to bottom, #00b2e1, #008eb4); box-shadow: 0 6px 0 #005d76, 0 10px 20px rgba(0,0,0,0.6), inset 0 2px 2px rgba(255,255,255,0.3); }
        .btn-primary:active, .btn-primary.sim-active { transform: translateY(6px); box-shadow: 0 0px 0 #005d76, 0 2px 5px rgba(0,0,0,0.6), inset 0 2px 2px rgba(0,0,0,0.3); }
        
        .btn-secondary { background: linear-gradient(to bottom, #bf4ea4, #9e3f87); box-shadow: 0 6px 0 #6e2a5d, 0 10px 20px rgba(0,0,0,0.6), inset 0 2px 2px rgba(255,255,255,0.3); font-size: 18px; padding: 15px; }
        .btn-secondary:active, .btn-secondary.sim-active { transform: translateY(6px); box-shadow: 0 0px 0 #6e2a5d, 0 2px 5px rgba(0,0,0,0.6), inset 0 2px 2px rgba(0,0,0,0.3); }

        .btn-close { background: linear-gradient(to bottom, #f14e54, #d04348); color: white; border: 3px solid #000; padding: 10px 25px; font-weight: 900; border-radius: 8px; cursor: pointer; font-size: 16px; box-shadow: 0 4px 0 #8a2a2e, inset 0 2px 2px rgba(255,255,255,0.3); transition: transform 0.1s, box-shadow 0.1s; font-family: 'Ubuntu', sans-serif; }
        .btn-close:active, .btn-close.sim-active { transform: translateY(4px); box-shadow: 0 0px 0 #8a2a2e, inset 0 2px 2px rgba(0,0,0,0.3) !important; }
        
        .hint-text { margin-top: 20px; font-size: 14px; color: #aaa; font-weight: bold; text-shadow: 1px 1px 0 #000; letter-spacing: 0.5px;}

        #tree-modal { display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); justify-content: center; align-items: center; z-index: 200; pointer-events: auto; backdrop-filter: blur(8px);}
        .tree-container { background: #222; border: 4px solid #555; border-radius: 15px; width: 95%; height: 95%; max-width: 1200px; display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 0 50px rgba(0,0,0,0.9);}
        .tree-header { padding: 20px 30px; background: #111; display: flex; justify-content: space-between; align-items: center; border-bottom: 4px solid #444; }
        .tree-header h2 { margin: 0; color: #fff; text-shadow: 2px 2px 0 #000; font-size: 24px;}
        .tree-scroll { flex: 1; overflow: auto; position: relative; background: radial-gradient(circle, #2a2a2a 0%, #151515 100%); display: block; padding: 30px;}
        #treeCanvas { background: transparent; display: block; margin: 0 auto;}

        @keyframes deathPopup {
            0% { transform: scale(0.6); opacity: 0; filter: blur(5px); }
            70% { transform: scale(1.05); opacity: 1; filter: blur(0px); }
            100% { transform: scale(1); opacity: 1; filter: blur(0px); }
        }
        .death-anim {
            animation: deathPopup 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }
    </style>
